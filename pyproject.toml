[project]
name = "hh-relay"
version = "0.1.0"
description = "FastAPI relay for the official hh.ru vacancy API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17,<2",
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116.1,<0.117",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1,<4",
    "mcp>=1.13,<2",
    "openai>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11.7,<3",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.9,<0.13",
    "uvicorn>=0.35.0,<0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_relay"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["EM101", "PLR2004", "S101"]
"src/hh_relay/ai_service.py" = ["RUF001"]
"src/hh_relay/dashboard.py" = ["RUF001"]
"src/hh_relay/monitor.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
